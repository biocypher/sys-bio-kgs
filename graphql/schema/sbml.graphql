# Neo4j GraphQL schema for the SBML part of the sys-bio-kgs graph (hand-written).
# Served by default by the graphql service; examples in sbml.examples.graphql,
# checks against Cypher in sbml.checks.js.
#
# - type names = BioCypher class names = Neo4j labels
# - relationship types as BioCypher writes them (e.g. ContainedEntity)
# - both directions, with readable field names
# - relationship properties as `type ... @relationshipProperties` (Neo4j GraphQL >= 4)
# - read-only (no mutations)
# - SystemsBiologyRepresentation (ontology root) as an interface for queries across types

extend schema @mutation(operations: [])

interface SystemsBiologyRepresentation {
  id: ID!
  name: String
}

type Model implements SystemsBiologyRepresentation @node(labels: ["Model"]) {
  id: ID!
  name: String
  sbo: String
  notes_base64: String
  notes: String
  encodes: [String!]
  hasPart: [String!]
  hasProperty: [String!]
  hasVersion: [String!]
  is: [String!]
  isDescribedBy: [String!]
  isEncodedBy: [String!]
  isHomologTo: [String!]
  isPartOf: [String!]
  isPropertyOf: [String!]
  isVersionOf: [String!]
  occursIn: [String!]
  hasTaxon: [String!]
  hasInstance: [String!]
  isDerivedFrom: [String!]
  isInstanceOf: [String!]
  entities: [PhysicalEntityRepresentation!]! @relationship(type: "IsEntityOf", direction: IN)
  processes: [Process!]! @relationship(type: "IsProcessOf", direction: IN)
  compartments: [PhysicalCompartment!]! @relationship(type: "IsCompartmentOf", direction: IN)
}

type PhysicalEntityRepresentation implements SystemsBiologyRepresentation @node(labels: ["PhysicalEntityRepresentation"]) {
  id: ID!
  name: String
  sbo: String
  notes_base64: String
  notes: String
  encodes: [String!]
  hasPart: [String!]
  hasProperty: [String!]
  hasVersion: [String!]
  is: [String!]
  isDescribedBy: [String!]
  isEncodedBy: [String!]
  isHomologTo: [String!]
  isPartOf: [String!]
  isPropertyOf: [String!]
  isVersionOf: [String!]
  occursIn: [String!]
  hasTaxon: [String!]
  hasInstance: [String!]
  isDerivedFrom: [String!]
  isInstanceOf: [String!]
  model: [Model!]! @relationship(type: "IsEntityOf", direction: OUT)
  compartment: [PhysicalCompartment!]! @relationship(type: "ContainedEntity", direction: OUT, properties: "ContainedEntityProperties")
  reactantOf: [Process!]! @relationship(type: "Reactant", direction: OUT, properties: "ReactantProperties")
  modifierOf: [Process!]! @relationship(type: "Modifier", direction: OUT, properties: "ModifierProperties")
  productOf: [Process!]! @relationship(type: "Product", direction: IN, properties: "ProductProperties")
}

type PhysicalCompartment implements SystemsBiologyRepresentation @node(labels: ["PhysicalCompartment"]) {
  id: ID!
  name: String
  sbo: String
  notes_base64: String
  notes: String
  encodes: [String!]
  hasPart: [String!]
  hasProperty: [String!]
  hasVersion: [String!]
  is: [String!]
  isDescribedBy: [String!]
  isEncodedBy: [String!]
  isHomologTo: [String!]
  isPartOf: [String!]
  isPropertyOf: [String!]
  isVersionOf: [String!]
  occursIn: [String!]
  hasTaxon: [String!]
  hasInstance: [String!]
  isDerivedFrom: [String!]
  isInstanceOf: [String!]
  model: [Model!]! @relationship(type: "IsCompartmentOf", direction: OUT)
  entities: [PhysicalEntityRepresentation!]! @relationship(type: "ContainedEntity", direction: IN, properties: "ContainedEntityProperties")
}

type Process implements SystemsBiologyRepresentation @node(labels: ["Process"]) {
  id: ID!
  name: String
  sbo: String
  notes_base64: String
  notes: String
  encodes: [String!]
  hasPart: [String!]
  hasProperty: [String!]
  hasVersion: [String!]
  is: [String!]
  isDescribedBy: [String!]
  isEncodedBy: [String!]
  isHomologTo: [String!]
  isPartOf: [String!]
  isPropertyOf: [String!]
  isVersionOf: [String!]
  occursIn: [String!]
  hasTaxon: [String!]
  hasInstance: [String!]
  isDerivedFrom: [String!]
  isInstanceOf: [String!]
  model: [Model!]! @relationship(type: "IsProcessOf", direction: OUT)
  reactants: [PhysicalEntityRepresentation!]! @relationship(type: "Reactant", direction: IN, properties: "ReactantProperties")
  modifiers: [PhysicalEntityRepresentation!]! @relationship(type: "Modifier", direction: IN, properties: "ModifierProperties")
  products: [PhysicalEntityRepresentation!]! @relationship(type: "Product", direction: OUT, properties: "ProductProperties")
}

