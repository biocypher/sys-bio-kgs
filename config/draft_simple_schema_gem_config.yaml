    is: str[]
    isDescribedBy: str[]
    isEncodedBy: str[]
    isHomologTo: str[]
    isPartOf: str[]
    isPropertyOf: str[]
    isVersionOf: str[]
    occursIn: str[]
    hasTaxon: str[]
    hasInstance: str[]
    is: str[]
    isDerivedFrom: str[]
    isDescribedBy: str[]
    isInstanceOf: str[]

