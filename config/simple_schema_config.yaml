# Schema Configuration for sys-bio-kgs
# Using Systems Biology Ontology (SBO) as the head ontology
# SBO URL: https://raw.githubusercontent.com/EBI-BioModels/SBO/refs/heads/master/SBO_OWL.owl

# SBGN and SBML biochemical reaction components mapped to SBO classes
# Using SBO classes directly where they exist (no is_a if class exists in SBO)


# so that all children have name, sbo, notes, annotations
occurring entity representation: # SBO_0000231: occurring entity representation
  represented_as: node
  properties:
    name: string
    sbo: string

    notes_base64: string
    notes: string

    # qualifierss from momapy
    encodes: str[]
    hasPart: str[]
    hasProperty: str[]
    hasVersion: str[]
    is: str[]
    isDescribedBy: str[]
    isEncodedBy: str[]
    isHomologTo: str[]
    isPartOf: str[]
    isPropertyOf: str[]
    isVersionOf: str[]
    occursIn: str[]
    hasTaxon: str[]
    hasInstance: str[]
    is: str[]
    isDerivedFrom: str[]
    isDescribedBy: str[]
    isInstanceOf: str[]

model:
  is_a: occurring entity representation # SBO_0000231: occurring entity representation
  represented_as: node
  input_label: model

  properties:
    name: string
    sbo: string

    notes_base64: string
    notes: string

    # qualifierss from momapy
    encodes: str[]
    hasPart: str[]
    hasProperty: str[]
    hasVersion: str[]
    is: str[]
    isDescribedBy: str[]
    isEncodedBy: str[]
    isHomologTo: str[]
    isPartOf: str[]
    isPropertyOf: str[]
    isVersionOf: str[]
    occursIn: str[]
    hasTaxon: str[]
    hasInstance: str[]
    is: str[]
    isDerivedFrom: str[]
    isDescribedBy: str[]
    isInstanceOf: str[]

# SBML - species, SBGN - entity pool
