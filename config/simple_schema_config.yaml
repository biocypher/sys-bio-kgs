# edges from model to its components
is entity of:
  is_a: participant
  represented_as: edge
  input_label: entity_of
  target: model
  source: physical entity representation

is process of:
  is_a: participant
  represented_as: edge
  input_label: process_of
  target: model
  source: process

is compartment of:
  is_a: participant
  represented_as: edge
  input_label: compartment_of
  target: model
  source: physical compartment

empty set: # SBO_0000355
  is_a: physical entity representation
  inherit_properties: true
  represented_as: node
  input_label: empty set

macromolecule: # SBO_0000245
  is_a: physical entity representation
  inherit_properties: true
  represented_as: node
  input_label: macromolecule

information macromolecule: # SBO_0000246
  inherit_properties: true
  represented_as: node
  input_label: information macromolecule

inhibition: # SBO_0000169
  inherit_properties: true
  represented_as: edge
