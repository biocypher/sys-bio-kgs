necessary stimulation: # SBO_0000171
  inherit_properties: true
  represented_as: edge
  input_label: necessary stimulation

catalysis: # SBO_0000176
  inherit_properties: true
  represented_as: edge
  input_label: catalysis

similarity:
  is_a: relationship
  represented_as: edge
  input_label: similarity