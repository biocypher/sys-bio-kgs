# Three-step pipeline: build -> import -> deploy.
# Every step reads/writes host directories, so each can be run on its own and
# its files inspected or removed locally. See "Docker Usage" in README.md.
#
#   NEO4J_DIR   host directory for the Neo4j database, logs and plugins (default: neo4j)
#   PIPELINE_SCRIPT  script run by the build step (default: create_knowledge_graph_sbgn_sbml.py)
#   CLEAN_OUTPUT     1: replace earlier build output (default), 0: add to it

x-user: &user "${UID:-1000}:${GID:-1000}"

services:

  # Run the BioCypher pipeline -> biocypher-out/build2neo/
  build:
    image: biocypher/base:1.2.0
    volumes:
      - .:/src
    environment:
      UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      PIPELINE_SCRIPT: ${PIPELINE_SCRIPT:-create_knowledge_graph_sbgn_sbml.py}
      CLEAN_OUTPUT: ${CLEAN_OUTPUT:-1}
    entrypoint: ["/bin/bash", "/src/scripts/build.sh"]
    user: *user

  # neo4j-admin import biocypher-out/build2neo/ -> ${NEO4J_DIR}/data/
  import:
    image: neo4j:5.26-community
    volumes:
      - ./biocypher-out/build2neo:/build2neo:ro
      - ./${NEO4J_DIR:-neo4j}/data:/data
      - ./${NEO4J_DIR:-neo4j}/logs:/logs
      - ./scripts/import.sh:/scripts/import.sh:ro
    environment:
      NEO4J_AUTH: none
    command: ["/bin/bash", "/scripts/import.sh"]
    depends_on:
      build:
        condition: service_completed_successfully
    user: *user

  # Serve ${NEO4J_DIR}/data/ at http://localhost:7474 (bolt: 7687), with APOC
  deploy:
    image: neo4j:5.26-community
    volumes:
      - ./${NEO4J_DIR:-neo4j}/data:/data
      - ./${NEO4J_DIR:-neo4j}/logs:/logs
      - ./${NEO4J_DIR:-neo4j}/plugins:/plugins
    environment:
      NEO4J_AUTH: none
      NEO4J_server_databases_default__to__read__only: "false"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "false"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    depends_on:
      import:
        condition: service_completed_successfully
    user: *user

  # Optional: BioChatter Light (knowledge graph tab) on the deployed database, at
  # http://localhost:8501. Needs GOOGLE_API_KEY (Gemini), e.g. in .env (git-ignored).
  # Start with: docker compose --profile biochatter up -d --no-deps biochatter
  biochatter:
    image: biocypher/biochatter-light:0.9.0
    profiles: ["biochatter"]
    volumes:
      # registers BIOCHATTER_DEFAULT_MODEL as a Gemini model (see the file)
      - ./docker/biochatter:/patches:ro
    environment:
      PYTHONPATH: /patches
      DOCKER_COMPOSE: "true"
      NEO4J_URI: bolt://deploy:7687
      # the database runs without authentication; any credentials are accepted
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j
      NEO4J_DBNAME: neo4j
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BIOCHATTER_DEFAULT_MODEL: ${BIOCHATTER_MODEL:-gemini-flash-lite-latest}
      BIOCHATTER_DEFAULT_MODEL_PROVIDER: google_genai
      KNOWLEDGE_GRAPH_TAB: "true"
      CHAT_TAB: "false"
      PROMPT_ENGINEERING_TAB: "false"
      RAG_TAB: "false"
      CORRECTING_AGENT_TAB: "false"
    ports:
      - "127.0.0.1:8501:8501"
